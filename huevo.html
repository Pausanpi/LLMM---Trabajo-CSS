<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8">
		<title>Windows 98</title>
		<link rel="stylesheet" href="style.css">
		<link rel="stylesheet" href="huevito.css">
		<link rel="icon" href="https://win98icons.alexmeub.com/icons/png/windows-0.png">
	</head>
	<body>

		<div class="main">
			<div class="izq">
				<a href="index.html">
					<div class="boton">
						<img src="https://win98icons.alexmeub.com/icons/png/directory_closed-4.png">
						<p>Carpeta</p>
					</div>
				</a>
				<div class="boton">
					<img class="tama" src="assets/blando.png">
					<p>Egg-Timer</p>
				</div>
				<a href="calculadora.html">
					<div class="boton">
						<img class="tama" src="https://win98icons.alexmeub.com/icons/png/calculator-0.png">
						<p>Calculadora</p>
					</div>
				</a>
				<a href="pokedex.html">
					<div class="boton">
						<img class="tama" src="assets/pokedex.png">
						<p>Pokédex</p>
					</div>
				</a>
				<a href="minecraft.html">
					<div class="boton">
						<img class="tama" src="https://www.rw-designer.com/icon-image/5547-256x256x32.png">
						<p>Minecraft</p>
					</div>
				</a>
			</div>

			<div class="centro">
				<div class="ventana-huevo">
					<div class="cabecera-huevo">
						<span>Egg-Timer</span>
						<div class="boton-ventana-huevo">
							<button class="window-button" onclick="window.location.href='index.html'">
								<img src="https://win98icons.alexmeub.com/images/close-icon.png">
							</button>
						</div>
					</div>
					<div class="contenedor-huevo">
						<div class="opciones">
							<h3>Selecciona una opción:</h3>
							<button class="boton-opcion">Pasado</button>
							<button class="boton-opcion">Blando</button>
							<button class="boton-opcion">Medio</button>
							<button class="boton-opcion">Duro</button>
						</div>

						<div class="timer">
							<div class="animacion">
								<img src="assets/animation/frame0.png" alt="Frame 1">
								<img src="assets/animation/frame1.png" alt="Frame 2">
								<img src="assets/animation/frame2.png" alt="Frame 3">
								<img src="assets/animation/frame3.png" alt="Frame 4">
								<img src="assets/animation/frame4.png" alt="Frame 5">
								<img src="assets/animation/frame5.png" alt="Frame 6">
								<img src="assets/animation/frame6.png" alt="Frame 7">
								<img src="assets/animation/frame7.png" alt="Frame 8">
								<img src="assets/animation/frame8.png" alt="Frame 9">
								<img src="assets/animation/frame9.png" alt="Frame 10">
							</div>
							<h2 id="countdown">00:00</h2>
							<div class="botones-timer">
								<button class="boton-timer">▶</button>
								<button class="boton-timer">⏹</button>
							</div>
						</div>
					</div>
				</div>
			</div>

			<!-- Modal de tiempo terminado -->
			<div id="modalTimeUp" class="modal-overlay">
				<div class="modal-window">
					<div class="cabecera-huevo">
						<span>Egg-Timer</span>
						<div class="boton-ventana-huevo">
							<button class="window-button" onclick="closeModal()">
								<img src="https://win98icons.alexmeub.com/images/close-icon.png">
							</button>
						</div>
					</div>
					<div class="modal-body">
						<p class="modal-message">¡Tiempo terminado!</p>
					</div>
					<div class="modal-footer">
						<button class="modal-button" onclick="closeModal()">Aceptar</button>
					</div>
				</div>
			</div>

			<div class="derch">
				<div class="meme">
					<header class="cabecera-meme">
						<span>Meme</span>
						<div class="botones-meme">
							<button class="window-button">
								<img src="https://win98icons.alexmeub.com/images/question-icon.png">
							</button>
							<button class="window-button">
								<img src="https://win98icons.alexmeub.com/images/close-icon.png">
							</button>
						</div>

					</header>
					<div class="imagen-meme">
						<div class="fondo-imagen-meme">
							<img src="https://i.pinimg.com/474x/63/39/2f/63392fa88244d183777fdb1018e4b602.jpg">
						</div>
					</div>
				</div>
			</div>
		</div>
		<!-- FOOTER -->
		<div class="bar">
			<div style="display: flex; flex-direction: row;">
				<div class="start-button">
					<img src="https://win98icons.alexmeub.com/icons/png/windows-0.png">
					<span>Start</span>
				</div>
				<div class="bar-linea"></div>
				<div class="abierto">
					<img src="assets/blando.png" style="width: 16px; height: 16px;">
					<span>Egg-Timer</span>
				</div>
			</div>
			<div class="time">
				<img
					src="https://win98icons.alexmeub.com/icons/png/loudspeaker_rays-0.png">
				<span id="reloj"></span>
			</div>
		</div>

		<script src="script.js"></script>
	</body>
</html>
