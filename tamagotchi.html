<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8">
		<title>Windows 98</title>
		<link rel="stylesheet" href="style.css">
		<link rel="stylesheet" href="tama.css">
		<link rel="icon" href="https://win98icons.alexmeub.com/icons/png/windows-0.png">
	</head>
	<body>
		<div class="tamagotchi">
			<div class="cabecera">
				<span>Tamagotchi</span>
				<div class="boton-tama">
					<button class="window-button" onclick="window.location.href='index.html'">
						<img src="https://win98icons.alexmeub.com/images/close-icon.png">
					</button>
				</div>
			</div>

			<div class="juego">
				<div class="fondo-juego">
					<!-- <img src="https://i.pinimg.com/originals/8a/c3/c0/8ac3c04739e8304b934cab69357ccdb8.gif" style="width: 200px; height: 200px;"> -->
					<img src="https://i.pinimg.com/originals/75/ec/ff/75ecff0b51e54c7c9bc54b24aa146467.gif" style="width: 150px; height: 150px;">
				</div>
				<div class="botones-juego">
					<div class="boton-juego">Comida</div>
					<div class="boton-juego">Amor</div>
					<div class="boton-juego">Limpiar</div>
				</div>
			</div>
		</div>

		<!-- FOOTER -->
		<div class="bar">
			<div style="display: flex; flex-direction: row;">
				<div class="start-button">
					<img src="https://win98icons.alexmeub.com/icons/png/windows-0.png">
					<span>Start</span>
				</div>
				<div class="bar-linea"></div>
				<div class="abierto">
					<img src="assets/tamagotchi.png" style="width: 16px; height: 16px;">
					<span>Tamagotchi</span>
				</div>
			</div>
			<div class="time">
				<img src="https://win98icons.alexmeub.com/icons/png/loudspeaker_rays-0.png">
				<span id="reloj"></span>
			</div>
		</div>

		<script src="script.js"></script>
	</body>
</html>
